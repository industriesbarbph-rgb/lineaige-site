name: Rebuild LINEAiGE Public Surfaces

on:
  push:
    branches: [main]
    paths:
      - "data/events.json"
      - "scripts/rebuild_public.py"
      - ".github/workflows/rebuild-backfill.yml"
      - "scripts/rebuild_public.py"
      - "data/events.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lineaige-public-data-write
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Rebuild public record surfaces
        run: python3 scripts/rebuild_public.py

      - name: Validate generated public surfaces
        run: |
          python3 -m json.tool data/events.json >/dev/null
          test -s records/index.html
          test -s sitemap.xml
          grep -q "LINEAiGE Record Index" records/index.html

      - name: Commit rebuilt pages
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No rebuilt public changes."
            exit 0
          fi
          git config user.name "LINEAiGE PUBLIC"
          git config user.email "actions@users.noreply.github.com"
          git add records/index.html sitemap.xml record/
          git commit -m "site: rebuild canonical record surfaces"
          git push
