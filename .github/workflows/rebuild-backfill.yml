name: Rebuild LINEAiGE Public Surfaces

on:
  push:
    branches: [main]
    paths:
      - "data/events.json"
      - "data/future-announcements.json"
      - "data/courses.json"
      - "data/media.json"
      - "scripts/rebuild_public.py"
      - ".github/workflows/rebuild-backfill.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lineaige-public-data-write
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Rebuild public record surfaces
        run: python3 scripts/rebuild_public.py

      - name: Validate generated public surfaces
        run: |
          python3 -m py_compile scripts/rebuild_public.py
          python3 -m json.tool data/events.json >/dev/null
          python3 -m json.tool data/future-announcements.json >/dev/null
          python3 -m json.tool data/courses.json >/dev/null
          python3 -m json.tool data/media.json >/dev/null
          test -s records/index.html
          test -s sitemap.xml
          grep -q "LINEAiGE Record Index" records/index.html
          grep -q "application/ld+json" record/transformer-2017/index.html
          grep -q "og:title" record/transformer-2017/index.html
          grep -q "Trace the chronology" record/transformer-2017/index.html
          grep -q "application/ld+json" future/stargate-norway-100k-gpus-2026/index.html

      - name: Commit rebuilt pages
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No rebuilt public changes."
            exit 0
          fi
          git config user.name "LINEAiGE PUBLIC"
          git config user.email "actions@users.noreply.github.com"
          git add index.html records/index.html sitemap.xml record/ future/ learn/ context/
          git commit -m "site: rebuild canonical record surfaces"
          # Reconcile a main-branch update that may land while pages are rebuilt.
          # Any real content conflict remains fail-closed.
          git pull --rebase origin main
          git push
