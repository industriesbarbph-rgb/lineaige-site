name: LINEAiGE Autonomous GREEN Refresh

on:
  schedule:
    - cron: "17 2,14 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/green-lane.json"
      - "scripts/green_lane.py"
      - ".github/workflows/autonomous-green.yml"

permissions:
  contents: write

concurrency:
  group: lineaige-public-data-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out public LINEAiGE
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify autonomous scripts
        run: |
          python3 -m py_compile scripts/green_lane.py scripts/rebuild_public.py
          python3 -m json.tool config/green-lane.json >/dev/null
          python3 -m json.tool data/events.json >/dev/null

      - name: Run deterministic GREEN lane
        run: python3 scripts/green_lane.py

      - name: Stop cleanly when canonical history did not change
        id: changed
        shell: bash
        run: |
          if git diff --quiet -- data/events.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No GREEN admissions. No public commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild public record surfaces
        if: steps.changed.outputs.changed == 'true'
        run: python3 scripts/rebuild_public.py

      - name: Validate generated public data
        if: steps.changed.outputs.changed == 'true'
        run: |
          python3 -m json.tool data/events.json >/dev/null
          grep -q "const CANONICAL_DATA_URL='data/events.json';" index.html
          test -s records/index.html
          test -s sitemap.xml

      - name: Publish canonical GREEN admissions
        if: steps.changed.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "LINEAiGE GREEN"
          git config user.email "actions@users.noreply.github.com"
          git add data/events.json records/index.html sitemap.xml record/
          git commit -m "LINEAiGE: autonomous GREEN admission"
          git push
